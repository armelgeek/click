stages:
  - build 
  - deploy
 
variables:
  DOCKER_TLS_CERTDIR: ''
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  REMOTE_DIR: "$REMOTE_DIR"
  DOCKER_REGISTRY: "$REGISTRY_HOST"
  IMAGE_NAME: "$REGISTRY_HOST/$IMAGE:$IMAGE_TAG"

before_script:
  - apk add --no-cache openssh-client
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/ssh_key
  - chmod 600 ~/.ssh/ssh_key
  - ssh-keyscan -H $SSH_IP >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  - echo "SSH connection setup"

build:
  stage: build
  image: alpine:latest
  script:
    - |
      echo " Connecting to remote server to build image..."
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/ssh_key $SSH_USER@$SSH_IP <<EOF
        set -e
        cd "/home/project/mobile-app" || exit 1

        echo "Login to registry"
        echo "$REGISTRY_PASS" | docker login $DOCKER_REGISTRY -u $REGISTRY_USER --password-stdin

        echo "Pulling latest changes from repo & building "
        git pull origin dev
        docker build -t "$IMAGE_NAME" .

        echo "Pushing image"
        docker push "$IMAGE_NAME"
        
        echo "Build ok"
      EOF
  only:
    - dev

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - |
      echo "Connecting to remote server to deploy..."
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/ssh_key $SSH_USER@$SSH_IP <<EOF
        set -e
        cd "/home/project/mobile-app" || exit 1

        echo "Registry login... "
        echo "$REGISTRY_PASS" | docker login $DOCKER_REGISTRY -u $REGISTRY_USER --password-stdin
               
        echo "Replacing image tag and deploying updated front..."
        echo "$IMAGE_TAG"
        sed "s|image: .*|image: $IMAGE_NAME|" deploy.yml | tee /tmp/vapostore-mobil-app.yml | microk8s kubectl apply -f -
        cat /tmp/vapostore-mobil-app.yml
        
        echo "Deployment successful."
        
        # Nettoyage
        docker images --format '{{.Repository}} {{.ID}}' |grep '^registry.meko.ac/vapostore_uber-mobil_admin' | awk '{print $2}' | xargs -r docker rmi -f
        docker buildx prune -f

      EOF
  only: 
    - dev
