<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click & Vape</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js');
        });
      }
    </script>
  </head>
  <body>
    <div id="splash-screen" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;">
      <img src="/icon.png" alt="ClicknVape Logo" />
      <div style="margin-top:24px;display:flex;gap:8px;">
        <span class="splash-dot" style="width:12px;height:12px;border-radius:50%;background:#00D97E;opacity:0.5;animation:splashDot 1.2s infinite;"></span>
        <span class="splash-dot" style="width:12px;height:12px;border-radius:50%;background:#00D97E;opacity:0.5;animation:splashDot 1.2s infinite 0.3s;"></span>
        <span class="splash-dot" style="width:12px;height:12px;border-radius:50%;background:#00D97E;opacity:0.5;animation:splashDot 1.2s infinite 0.6s;"></span>
      </div>
      <style>
        @keyframes splashDot {
          0%, 80%, 100% { opacity: 0.5; transform: scale(1); }
          40% { opacity: 1; transform: scale(1.3); }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module">
      window.addEventListener('DOMContentLoaded', () => {
        const removeSplash = () => {
          const splash = document.getElementById('splash-screen');
          if (splash) splash.remove();
        };
        window.addEventListener('load', removeSplash);
        setTimeout(removeSplash, 1200);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
